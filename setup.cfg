[metadata]
name = pyknic-todo
version = attr: pyknic_todo.__version__
description = Simple CLI todo list utility with JSON storage and recurrence support
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Environment :: Console

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pydantic>=2.0.0
    pydantic-settings>=2.0.0

[options.packages.find]
exclude =
    tests*
    data*

[options.extras_require]
all =

    pyknic

    twine

    flake8
	mypy
	pytest
    pytest-cov
    pytest-html

dev =
	twine

test =
    flake8
    mypy
    pytest
    pytest-cov
    pytest-html

[options.entry_points]
console_scripts =
    pyknic-todo = pyknic_todo.cli:main

[tool:pytest]
python_files = tests/pytest/*.py
addopts = -v
  --html=docs/pytest/index.html
  --capture=sys
  --cov pyknic_todo
  --cov-report html:docs/pytest-coverage
  --cov-report xml:docs/pytest-coverage.xml
  --cov-report lcov:docs/pytest-coverage.lcov

[flake8]
extend-ignore = E275
max-line-length = 120
jobs = 2

exclude = 
    .git,
    __pycache__,
    build,
    dist
    venv
    .venv
